[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyi-deps"
version = "1.0.0"
description = "Generate PyInstaller hidden imports by scanning a staged Python tree"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "suimajian" }]
keywords = ["pyinstaller", "packaging", "hiddenimports", "frozen"]

[project.urls]
Homepage = "https://github.com/suimajian/pyi-deps"

[project.scripts]
pyi-deps = "pyi_deps:main"

[tool.setuptools]
packages = ["pyi_deps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
