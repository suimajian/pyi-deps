[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyi-deps"
version = "0.1.2"
description = "Generate PyInstaller hidden imports by scanning a staged Python tree"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "suimajian" }]
keywords = ["pyinstaller", "packaging", "hiddenimports", "frozen"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/suimajian/pyi-deps"
Source = "https://github.com/suimajian/pyi-deps"
Issues = "https://github.com/suimajian/pyi-deps/issues"

[project.scripts]
pyi-deps = "pyi_deps:main"

[tool.setuptools]
packages = ["pyi_deps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
