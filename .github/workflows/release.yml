name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Publishing is opt-in: add PYPI_API_TOKEN as a repository secret and this step
      # runs; without it the build artifacts are simply uploaded and the step is skipped.
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}